<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Tag HTML</title>
    <style>
        li{
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul type="square"> 
        <li title="Utilize a tag <p>...</p>">Parágrafos</li>
        <li title="Utilize a tag <title>...</title>">Titulos</li>
        <li title="Utilize a tag <img>">Imagens</li>
        <li title="Utilize a tag <abbr>...</abbr>">Abreviações</li>
        <li title="Utilize a tag <code>">Código-fonte</li>
        <li title="Utilize a tag <ol>...</ol>">Lista ordenada/numerada</li>
        <li title="Utilize a tag <ul>...</ul>">Lista com marcadores</li>
    </ul>
</body>
</html>
